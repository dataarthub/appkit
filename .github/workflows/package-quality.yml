# Generated: github-docs/public/templates/private-actions/public; reviewed base ae1ac274494114599ea6c0de2e02c1e61f324e42 (local-reviewed).
# Bundle SHA-256: 69111de4aafb48fb77e3d8e702b88abdd18fc357a1a4a474a9e6a1ef27dd6fb6
# Project adapter: .github/workflow-adapter.json; source: scripts/workflow-project/roles.json
# Run workflow:generate explicitly; workflow:check never repairs output.
name: "Shared package quality"
on:
  workflow_call:
    inputs:
      packed_consumer:
        type: "boolean"
        default: false
permissions:
  contents: "read"
  actions: "read"
jobs:
  verify:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
          - 26
    steps:
      -
        uses: "actions/checkout@v6"
        with:
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: "${{ matrix.node }}"
          check-latest: true
          package-manager-cache: false
        name: "Shared: actions/setup-node@v6"
      -
        uses: "oven-sh/setup-bun@v2"
        with:
          bun-version: "1.4.0"
        name: "Shared: oven-sh/setup-bun@v2"
      -
        name: "Shared: Verify generated workflow supply"
        run: "node scripts/workflow-supply/public/conformance.mjs check --project-root . --configuration-only"
      -
        name: "Project: Install offline UBL validator"
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libxml2-utils
          xmllint --version
      -
        name: "Project: Record runner identity"
        run: "echo \"APPKIT_CI_IMAGE=${ImageOS}-${ImageVersion}\" >> \"$GITHUB_ENV\""
      -
        uses: "actions/cache/restore@v4"
        with:
          path: "~/.bun/install/cache"
          key: "${{ runner.os }}-${{ runner.arch }}-appkit-bun-${{ hashFiles('bun.lock') }}"
          restore-keys: "${{ runner.os }}-${{ runner.arch }}-appkit-bun-"
        id: "shared-cache-5"
        name: "Shared: actions/cache/restore@v4"
      -
        run: "bun install --frozen-lockfile --ignore-scripts"
        name: "Project: Run declared project check"
      -
        uses: "actions/cache/restore@v4"
        id: "tasks"
        with:
          path: ".turbo/cache"
          key: "${{ runner.os }}-${{ runner.arch }}-appkit-two-node${{ matrix.node }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          restore-keys: "${{ runner.os }}-${{ runner.arch }}-appkit-two-node${{ matrix.node }}-"
        name: "Shared: actions/cache/restore@v4"
      -
        name: "Project: Select checks since the last successful main ancestor"
        id: "selection"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "node scripts/workflow-adapter.mjs plan"
      -
        name: "Project: Install pinned Chromium for Storybook verification"
        if: "matrix.node == 24 && steps.selection.outputs.browser == 'true'"
        run: "bunx --no-install playwright install --with-deps chromium"
      -
        name: "Project: Run the same gate as local pre-push"
        if: "matrix.node == 24"
        run: |
          bun run secrets:setup
          bun run verify:push --ci-plan
      -
        name: "Project: Verify Node 26 compatibility"
        if: "matrix.node != 24"
        run: "node scripts/verification/run.mjs --ci-plan --node-compat"
      -
        name: "Project: Verify isolated packed consumer when explicitly requested"
        if: "matrix.node == 24 && inputs.packed_consumer == true"
        run: "bun run test:consumer"
      -
        uses: "actions/cache/save@v4"
        if: "${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (!cancelled() && hashFiles('.turbo/cache/**') != '') }}"
        with:
          path: ".turbo/cache"
          key: "${{ steps.tasks.outputs.cache-primary-key }}"
        name: "Shared: actions/cache/save@v4"
      -
        name: "Shared: Save successful download/task cache"
        if: "${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shared-cache-5.outputs.cache-hit != 'true' }}"
        uses: "actions/cache/save@v4"
        with:
          path: "~/.bun/install/cache"
          key: "${{ steps.shared-cache-5.outputs.cache-primary-key }}"
      -
        name: "Shared: Record authoritative source evidence"
        if: "${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
        env:
          PUBLIC_SOURCE_NODE: "${{ matrix.node }}"
        run: "node scripts/workflow-supply/public/quality.mjs record"
      -
        name: "Shared: Preserve source evidence"
        if: "${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
        uses: "actions/upload-artifact@v7"
        with:
          name: "source-evidence-node${{ matrix.node }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: ".cache/public-quality/source.json"
          include-hidden-files: true
          if-no-files-found: "error"
          retention-days: 14
    name: "Verify packages (Node ${{ matrix.node }})"
    timeout-minutes: 35
