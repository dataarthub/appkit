name: "Publish npm packages"
run-name: "${{ inputs.recover_release != '' && format('Recover {0}', inputs.recover_release) || 'Publish npm packages' }}"
on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      staged_run:
        description: "Original successful staging run ID after human npm approval"
        required: false
        type: "string"
      recover_release:
        description: "Reviewed fixed candidate whose original run stopped before archive creation or staging"
        type: "choice"
        required: false
        default: ""
        options:
          - ""
          - "core-0.2.1"
permissions:
  contents: "read"
concurrency:
  group: "appkit-npm-release"
  cancel-in-progress: false
jobs:
  verify:
    if: |
      (github.event_name == 'release' && github.repository == 'dataarthub/appkit' && github.event.release.draft == false && github.event.release.prerelease == false && (github.event_name == 'release' && github.repository == 'dataarthub/appkit' && github.event.release.draft == false && github.event.release.prerelease == false && (startsWith(github.event.release.tag_name, 'appkit-core-v') ||
       startsWith(github.event.release.tag_name, 'appkit-react-v')))) || (github.event_name == 'workflow_dispatch' && github.repository == 'dataarthub/appkit' && github.ref == 'refs/heads/main' && inputs.recover_release != '' && inputs.staged_run == '')
    runs-on: "ubuntu-latest"
    timeout-minutes: 75
    permissions:
      contents: "read"
      actions: "read"
    outputs:
      sha: "${{ steps.select.outputs.sha }}"
      key: "${{ steps.select.outputs.key }}"
      environment: "${{ steps.select.outputs.environment }}"
      url: "${{ steps.select.outputs.url }}"
      integrity: "${{ steps.prepare.outputs.integrity }}"
      artifact: "${{ steps.upload.outputs.artifact-id }}"
      tag: "${{ steps.candidate.outputs.tag }}"
    steps:
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ github.sha }}"
          path: "control"
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
          check-latest: true
        name: "Shared: actions/setup-node@v6"
      -
        name: "Project: Resolve fixed source using maintained control code"
        id: "candidate"
        working-directory: "${{ github.workspace }}"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "node control/scripts/publish/select-source.mjs"
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ steps.candidate.outputs.sha }}"
          path: "source"
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        name: "Project: Validate package tag, version and source commit"
        id: "select"
        run: "node ../control/scripts/publish/select.mjs"
      -
        name: "Project: Require successful Public quality for the exact release commit"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "node ../control/scripts/publish/require-quality.mjs"
      -
        uses: "oven-sh/setup-bun@v2"
        with:
          bun-version: "1.4.0"
        name: "Shared: oven-sh/setup-bun@v2"
      -
        name: "Project: Install offline UBL validator"
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libxml2-utils
      -
        name: "Project: Record runner identity"
        run: "echo \"APPKIT_CI_IMAGE=${ImageOS}-${ImageVersion}\" >> \"$GITHUB_ENV\""
      -
        run: "bun install --frozen-lockfile --ignore-scripts"
        name: "Project: Run declared project check"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 26
          package-manager-cache: false
          check-latest: true
        name: "Shared: actions/setup-node@v6"
      -
        name: "Project: Authenticate original evidence and run full Node 26 compatibility"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "node ../control/scripts/publish/source-proof.mjs fresh"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
          check-latest: true
        name: "Shared: actions/setup-node@v6"
      -
        name: "Project: Install pinned Chromium and source safety tooling"
        run: |
          bun run secrets:setup
          bunx --no-install playwright install --with-deps chromium
      -
        name: "Project: Authenticate original evidence and run full Node 24 source checks"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "node ../control/scripts/publish/source-proof.mjs fresh"
      -
        name: "Project: Verify React with declared and candidate Core"
        if: "steps.select.outputs.key == 'react'"
        run: "bun run check:react-core --release"
      -
        name: "Project: Verify exact packed archives in isolated consumers"
        env:
          APPKIT_RELEASE_CONSUMER: "true"
        run: "bun run test:consumer"
      -
        name: "Project: Select only the tested target package archive"
        id: "prepare"
        run: "node ../control/scripts/publish/prepare.mjs"
      -
        uses: "actions/upload-artifact@v7"
        id: "upload"
        with:
          name: "npm-package-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            source/.verification/publish/package.tgz
            source/.verification/publish/release.json
          if-no-files-found: "error"
          retention-days: 7
          compression-level: 0
          include-hidden-files: true
        name: "Shared: actions/upload-artifact@v7"
    defaults:
      run:
        working-directory: "source"
    env:
      PUBLISH_PACKAGE_ROOT: "${{ github.workspace }}/source"
      GITHUB_TOKEN: "${{ github.token }}"
  stage:
    name: "Stage package for approval"
    needs: "verify"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      actions: "read"
      id-token: "write"
    environment:
      name: "${{ needs.verify.outputs.environment }}"
      deployment: false
    steps:
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ github.sha }}"
          path: "control"
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ needs.verify.outputs.sha }}"
          fetch-depth: 0
          persist-credentials: false
          path: "source"
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
          check-latest: true
        name: "Shared: actions/setup-node@v6"
      -
        name: "Project: Install pinned Trusted Publishing CLI"
        run: "npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund"
      -
        uses: "actions/download-artifact@v8"
        with:
          artifact-ids: "${{ needs.verify.outputs.artifact }}"
          path: "source/.verification/publish"
          digest-mismatch: "error"
        name: "Shared: actions/download-artifact@v8"
      -
        name: "Project: Recheck Public quality immediately before publication"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "node ../control/scripts/publish/require-quality.mjs"
      -
        name: "Project: Revalidate exact original Source quality evidence"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "node ../control/scripts/publish/source-proof.mjs writer"
      -
        name: "Project: Stage verified archive through OIDC"
        env:
          APPKIT_NPM_PUBLISH: "true"
          VERIFIED_INTEGRITY: "${{ needs.verify.outputs.integrity }}"
        run: "node ../control/scripts/publish/publish.mjs"
    defaults:
      run:
        working-directory: "source"
    env:
      PUBLISH_PACKAGE_ROOT: "${{ github.workspace }}/source"
      PUBLISH_SOURCE_SHA: "${{ needs.verify.outputs.sha }}"
      PUBLISH_RELEASE_TAG: "${{ needs.verify.outputs.tag }}"
      GITHUB_TOKEN: "${{ github.token }}"
  resolve:
    if: "github.event_name == 'workflow_dispatch' && github.repository == 'dataarthub/appkit' && github.ref == 'refs/heads/main' && inputs.recover_release == '' && inputs.staged_run != ''"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      actions: "read"
    outputs:
      sha: "${{ steps.source.outputs.sha }}"
      tag: "${{ steps.source.outputs.tag }}"
      environment: "${{ steps.source.outputs.environment }}"
      artifact: "${{ steps.source.outputs.artifact }}"
      control: "${{ steps.source.outputs.control }}"
      attempt: "${{ steps.source.outputs.attempt }}"
    steps:
      -
        uses: "actions/checkout@v6"
        with:
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
          check-latest: true
        name: "Shared: actions/setup-node@v6"
      -
        id: "source"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "node scripts/publish/resolve-resume.mjs"
        name: "Project: Run declared project check"
    timeout-minutes: 35
  complete:
    needs: "resolve"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
      actions: "read"
      deployments: "write"
      id-token: "write"
    env:
      PUBLISH_SOURCE_SHA: "${{ needs.resolve.outputs.sha }}"
      PUBLISH_RELEASE_TAG: "${{ needs.resolve.outputs.tag }}"
      GITHUB_TOKEN: "${{ github.token }}"
      PUBLISH_PACKAGE_ROOT: "${{ github.workspace }}/source"
      PUBLISH_PRODUCER_CONTROL: "${{ needs.resolve.outputs.control }}"
      PUBLISH_PRODUCER_RUN: "${{ inputs.staged_run }}"
      PUBLISH_PRODUCER_ATTEMPT: "${{ needs.resolve.outputs.attempt }}"
    steps:
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ github.sha }}"
          path: "control"
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ needs.resolve.outputs.sha }}"
          fetch-depth: 0
          persist-credentials: false
          path: "source"
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
          check-latest: true
        name: "Shared: actions/setup-node@v6"
      -
        uses: "actions/download-artifact@v8"
        with:
          artifact-ids: "${{ needs.resolve.outputs.artifact }}"
          run-id: "${{ inputs.staged_run }}"
          github-token: "${{ github.token }}"
          path: "source/.verification/publish"
          digest-mismatch: "error"
        name: "Shared: actions/download-artifact@v8"
      -
        name: "Project: Validate original release and select its npm environment"
        id: "select"
        run: "node ../control/scripts/publish/select.mjs"
      -
        name: "Project: Install pinned Trusted Publishing CLI"
        run: "npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund"
      -
        name: "Project: Recheck Public quality for the original release commit"
        run: "node ../control/scripts/publish/require-quality.mjs"
      -
        name: "Project: Revalidate exact original Source quality evidence"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "node ../control/scripts/publish/source-proof.mjs writer"
      -
        name: "Project: Confirm approved archive, required tags, staged cleanup and Deployment"
        env:
          APPKIT_NPM_PUBLISH: "true"
        run: "node ../control/scripts/publish/publish.mjs"
    environment:
      name: "${{ needs.resolve.outputs.environment }}"
      deployment: false
    defaults:
      run:
        working-directory: "source"
