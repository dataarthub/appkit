name: Public quality
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packed_consumer:
        description: Also verify exact archives in an isolated consumer
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: appkit-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install offline UBL validator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libxml2-utils
          xmllint --version
      - name: Record runner identity
        run: echo "APPKIT_CI_IMAGE=${ImageOS}-${ImageVersion}" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-appkit-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-appkit-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache/restore@v4
        id: tasks
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-appkit-two-node${{ matrix.node }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-appkit-two-node${{ matrix.node }}-
      - name: Install pinned Chromium for Storybook verification
        if: matrix.node == 24
        run: bunx --no-install playwright install --with-deps chromium
      - name: Run the same gate as local pre-push
        if: matrix.node == 24
        run: |
          bun run secrets:setup
          bun run verify:push
      - name: Verify Node 26 compatibility
        if: matrix.node != 24
        run: bun run turbo run build typecheck test
      - name: Verify isolated packed consumer when explicitly requested
        if: matrix.node == 24 && inputs.packed_consumer == true
        run: bun run test:consumer
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && hashFiles('.turbo/cache/**') != '' }}
        with:
          path: .turbo/cache
          key: ${{ steps.tasks.outputs.cache-primary-key }}
      # Verification receipts can contain local paths and environment details.
      # Share only separately reviewed, redacted copies; never upload raw logs.
